          - Each job: a line "### Job title – Employer, Location" and a line with dates as "Month Year – Month Year", then bullets starting with "- ".
          - Reverse-chronological. Dates as Month Year. Hard skills first. Bullets start with a strong action verb and show scope or results with the real numbers from the MASTER CV.
          - PROFESSIONAL SUMMARY: 3-4 lines aligned to this job's title and top requirements.
