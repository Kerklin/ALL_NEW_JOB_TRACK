          # ======================= Word (.docx) writer – no extra installs, ATS-safe =======================
          # A4, Arial, real Word headings and real bullet lists (no tables, columns, text boxes or images).
          W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'
          def _x(s): return (s or "").replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace('"', "&quot;")
          def _runs(text, size=None, bold_all=False):
              text = re.sub(r"\[([^\]]+)\]\((https?://[^)]+)\)", r"\1 (\2)", text)          # links → plain text
              out, parts = [], re.split(r"(\*\*[^*]+\*\*)", text)
              for p in parts:
                  if not p: continue
                  b = bold_all or (p.startswith("**") and p.endswith("**"))
                  p = p[2:-2] if p.startswith("**") and p.endswith("**") else p
                  p = p.replace("*", "") if not re.search(r"\w\*\w", p) else p
                  rpr = ("<w:b/>" if b else "") + (f'<w:sz w:val="{size}"/><w:szCs w:val="{size}"/>' if size else "")
                  out.append(f'<w:r>{"<w:rPr>" + rpr + "</w:rPr>" if rpr else ""}<w:t xml:space="preserve">{_x(p)}</w:t></w:r>')
              return "".join(out)
          def _p(inner, style=None, bullet=False, after=None, before=None, keep=False):
              ppr = (f'<w:pStyle w:val="{style}"/>' if style else "") + ('<w:keepNext/>' if keep else "") + \
                    ('<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>' if bullet else "") + \
                    (f'<w:spacing w:before="{before or 0}" w:after="{after if after is not None else 80}"/>' if (after is not None or before) else "")
              return f'<w:p>{"<w:pPr>" + ppr + "</w:pPr>" if ppr else ""}{inner}</w:p>'
          def md_to_body(md, kind):
              body, first = [], True
              for raw in md.splitlines():
                  line = raw.rstrip()
                  if not line.strip() or re.fullmatch(r"\s*(-{3,}|\*{3,}|_{3,})\s*", line): continue
                  s = line.strip()
                  if s.startswith("#"):
                      lvl = len(s) - len(s.lstrip("#")); txt = s.lstrip("#").strip()
                      if kind == "cl" and re.fullmatch(r"(?i)(cover letter|application email|propratno pismo|lettre de motivation)", txt): continue
                      if lvl == 1 or (first and kind == "cv"): body.append(_p(_runs(txt), "Title")); first = False; continue
                      body.append(_p(_runs(txt), "Heading1" if lvl == 2 else "Heading2", keep=True)); first = False; continue
                  m = re.match(r"^\s*(?:[-*•–]|\d+[.)])\s+(.*)", line)
                  if m: body.append(_p(_runs(m[1]), bullet=True, after=40)); first = False; continue
                  body.append(_p(_runs(s), after=120 if kind == "cl" else 60)); first = False
              return "".join(body) or _p(_runs(" "))
          def docx_bytes(md, kind, title):
              styles = f'''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles {W}>
          <w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial" w:eastAsia="Arial"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="en-GB"/></w:rPr></w:rPrDefault>
