                      else:
                          tell(f"Deep-dive agent: could not read {job['title'][:60]}", f"The agent could not read the job description at:\n{r['link']}\n\nReason: {why}.\n\n"
                               "Fix: in your repository select Add file → Create new file → name it cv-inbox/any-name.txt → paste the job link on the first line "
                               "and the full job text below → Commit. The full pack is emailed a few minutes later.\n\nNo AI budget was used.")
                      if r["file"]: inbox_done.append(r["file"])
                      continue
                  job["jd"] = text; jobs.append(job)
              L = None
              if jobs or marks:
                  L, why = acquire(max(1, len(jobs))) if jobs else (None, "")
                  if jobs and not L:
                      summary.append(f"⏳ Not started: {why}." + ("" if AUTO else " Your request is kept – run it again later."))
                      log.append(f"AI      not now: {why}")
              if L:
                  L.done.update(marks)
                  failed, made = False, 0
                  try:
                      for job in jobs:
                          if L.st.get("done", {}).get(jkey(job)) and job["auto"]:
                              summary.append(f"↷ **{job['title'][:80]}** – already done by another run."); continue
                          av = {t: 0 if L.blocked.get(t) == T else L.res[t] for t in ("high", "low")}
                          if av["high"] + av["low"] < 4:
                              summary.append(f"⏳ **{job['title'][:80]}** – not enough AI budget left in this run."); continue
                          try:
                              analysis, salary, cv, cl, models, nq, ev = build(L, job, job["jd"])
                          except NoAccess as e:
                              failed = True; summary.append("❌ AI refused access – check that GitHub Models is enabled for your account.")
                              issue("Job agent: AI (GitHub Models) is not available", f"The deep-dive agent was refused access ({str(e)[:120]}).")
                              break
                          except Stop as e:
                              failed = made == 0 and L.errors > 0
                              summary.append(f"⏳ **{job['title'][:80]}** – AI stopped ({e}); it will be tried again."); break
                          flags = checks(cv, cl, job["jd"], salary)
                          base = f"{ascii_(CAND).replace(' ', '_')}_{slug(job['title'])[:40]}"
                          letter = re.split(r"(?i)##\s*application email", cl)
                          email_part = letter[1].strip() if len(letter) > 1 else ""
                          srcs = [e for e in ev[1:] if e["lines"]]
                          report = (f"# Application pack (deep dive) – {job['title']}\n\n**Posting:** {job['link'] or 'pasted text'}  \n"
                                    f"**Prepared:** {T} by {', '.join(models)} (GitHub Models) · web searches: {nq} · salary sources found: {len(srcs)}"
                                    f"{'  · language: ' + LANG if LANG.lower() != 'auto' else ''}\n\n"
                                    + ("## ⚠️ Check before sending\n" + "\n".join(f"- {x}" for x in flags) + "\n\n" if flags else "")
                                    + f"---\n\n# A. Analysis, fit and HR prescreening\n\n{analysis}\n\n---\n\n# B. Salary expectations (web evidence)\n\n{re.sub(r"(?im)^##\s*salary expectations\s*$", "", salary).strip()}\n\n"
                                    f"---\n\n# C. Tailored CV (copy-paste ready)\n\n{cv}\n\n---\n\n# D. Cover letter (copy-paste ready)\n\n{letter[0].strip()}\n\n"
                                    f"---\n\n# E. Application email\n\n{email_part}\n")
                          files = [(f"{base}_CV.docx", docx_bytes(cv, "cv", f"CV – {job['title']}"), DOCX),
                                   (f"{base}_Cover_Letter.docx", docx_bytes(LETTERHEAD + letter[0], "cl", f"Cover letter – {job['title']}"), DOCX),
                                   (f"{base}_Deep_Dive.md", report.encode("utf-8"), "text/markdown")]
                          body = (f"Deep-dive application pack for: {job['title']}\n{job['link']}\n\n"
                                  + ("CHECK BEFORE SENDING:\n" + "\n".join(f"- {x}" for x in flags) + "\n\n" if flags else "No automatic warnings – still read every line before sending.\n\n")
                                  + "Attached: CV (Word), cover letter (Word), full report (text). The full report follows below.\n\n" + report)
                          try:
                              send(f"Deep-dive pack: {job['title'][:90]}", body, files)
                              summary.append(f"✅ **{job['title'][:80]}** – deep-dive pack emailed ({len(flags)} item(s) to check, {len(srcs)} salary source(s)).")
                              status = "deep-email"
                          except Exception as e:
                              Path("outbox").mkdir(exist_ok=True)
                              Path("outbox", f"{T}-deep-{slug(job['title'])}.md.sealed").write_bytes(seal(report, MAIL_PASS))
                              summary.append(f"📮 **{job['title'][:80]}** – email failed; saved encrypted in outbox/ and re-sent automatically (text version).")
                              log.append(f"EMAIL   failed ({str(e)[:60]})"); status = "deep-outbox"
                          L.done[jkey(job)] = {"pack": status, "day": T}; made += 1
                          if job["auto"]: L.deep += 1
                          if job["file"]: inbox_done.append(job["file"])
                  finally:
                      release(L, failed)
                      log.append(f"AI-LOCK reserved {L.used['high'] + L.used['low'] + L.res['high'] + L.res['low']}, used {L.used['high'] + L.used['low']}, "
                                 f"refunded {L.res['high'] + L.res['low']} · web searches {L.searches}")
              elif marks:                                              # nothing to build, but remember unreadable auto jobs
                  for _ in range(3):
                      sha, st = ledger_read()
                      if st is None or st.get("holder"): break
                      st = roll(st); st.setdefault("done", {}).update(marks)
                      if ledger_write(sha, st, f"{RUN_ID}: mark unreadable jobs"): break

          # ======================= tidy up =======================
          for f in inbox_done: Path(f).unlink(missing_ok=True)
          changed = [p for p in ("cv-inbox", "outbox") if Path(p).exists() or git("ls-files", p).stdout.strip()]
          if changed:
              git("add", "-A", "--", *changed)
              if git("diff", "--cached", "--quiet").returncode != 0:
                  git("commit", "-q", "-m", f"Deep-dive agent {T}")
                  for i in range(3):
                      if git("pull", "--quiet", "--rebase", "-X", "theirs", "origin", ENV("GITHUB_REF_NAME", "main")).returncode == 0 and \
                         git("push", "--quiet", "origin", f"HEAD:{ENV('GITHUB_REF_NAME', 'main')}").returncode == 0: break
                      time.sleep(5 * (i + 1))
                  else: log.append("SAVE    could not save the cv-inbox/outbox changes (retried next time)")
          out = "\n".join(["## Deep-dive application agent"] + [f"- {s}" for s in summary] + ["", "```", *log, "```"])
          print(out)
          if ENV("GITHUB_STEP_SUMMARY"): Path(ENV("GITHUB_STEP_SUMMARY")).write_text(out, encoding="utf-8")
          PY
