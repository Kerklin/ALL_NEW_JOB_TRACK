                      return "outbox:" + name
              Path("applications").mkdir(exist_ok=True)
              Path("applications", name).write_text(redact(text, MASTER_CV), encoding="utf-8")
              return "file:applications/" + name

          # ======================= self-check (nothing changes if any check fails) =======================
